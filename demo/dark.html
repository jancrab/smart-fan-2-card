<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Fan 2 · Dark-Mode-Vorschau</title>
<style>
  body { margin:0; padding:32px; background:#f4f5f6; color:#24292e; font-family:Arial,sans-serif; }
  main { max-width:920px; margin:auto; } h1 { font-weight:600; font-size:18px; margin:0 0 28px; } .label { color:#656e77; font-size:12px; margin:0 0 10px; }
  .layouts { display:grid; grid-template-columns:280px minmax(0,1fr); gap:24px; align-items:start; }
  smart-fan-2-card { display:block; } details { margin-top:28px; font-size:12px; color:#656e77; } summary { cursor:pointer; padding:12px 0; } input { padding:6px; border:1px solid #d6dbe0; border-radius:6px; } #log { font-size:12px; white-space:pre-wrap; overflow-wrap:anywhere; } @media(max-width:760px) { .layouts { grid-template-columns:1fr; } body { padding:20px; } .compact { max-width:280px; } }
</style>
<style>
  :root {
    color-scheme: dark;
    --primary-color: #80bfff;
    --primary-text-color: #e5e7eb;
    --secondary-text-color: #a0a8b3;
    --primary-background-color: #111418;
    --secondary-background-color: #262c34;
    --card-background-color: #1c2128;
    --ha-card-background: var(--card-background-color);
    --divider-color: #343c47;
    --ha-card-border-color: var(--divider-color);
    --ha-card-border-radius: 16px;
    --ha-card-box-shadow: none;
    --smart-fan-normal-color: #80bfff;
    --smart-fan-natural-color: #75d79b;
    --error-color: #ff8b87;
  }
  body { background: var(--primary-background-color); color: var(--primary-text-color); }
  .label, details { color: var(--secondary-text-color); }
  input { background: var(--secondary-background-color); color: var(--primary-text-color); border-color: var(--divider-color); }
</style>
<main><h1>Ventilator</h1>
<div class="layouts"><section class="compact"><p class="label">Dashboard · 280 px</p><smart-fan-2-card id="compact"></smart-fan-2-card></section><section><p class="label">Breite Ansicht</p><smart-fan-2-card id="wide"></smart-fan-2-card></section></div>
<details><summary>Demo-Einstellungen</summary><p>Simulierte Geräte, keine Verbindung zu Home Assistant.</p><p><label>Cycling-Zielwinkel: <input id="target" type="number" min="-120" max="120" step="1" value="-60"> °</label> · <span id="position">Kopfposition: 0°</span></p><p id="log" role="status">Bereit.</p></details></main>
<script type="module">
await import('/demo/icons.js');
await import('../dist/smart-fan-2-card.js');
let state = { state:'on', attributes:{ friendly_name:'Smartmi Standing Fan 2S', supported_features:59, percentage:33, percentage_step:1, oscillating:true, preset_modes:['normal','nature'], preset_mode:'normal' } };
let position=0, sweep=30, movement;
const config = {entity:'fan.demo',show_angle_slider:true,cycling_mode:'position',angle_entity:'number.sweep',position_entity:'sensor.position',target_angle:-60,name:'Wohnzimmer'};
const cards = ['compact','wide'].map(layout => { const card=document.getElementById(layout);card.setConfig({...config,layout});return card; });
document.getElementById('target').addEventListener('change',event=>{config.target_angle=Number(event.target.value);cards.forEach(card=>card.setConfig({...config,layout:card.id}));});
function update() { document.getElementById('position').textContent=`Kopfposition: ${position}°`; const hass={states:{'fan.demo':state,'number.sweep':{state:String(sweep),attributes:{min:1,max:120,step:1}},'sensor.position':{state:String(position)}},callService:async(domain,service,data)=>{
  document.getElementById('log').textContent=JSON.stringify({domain,service,...data},null,2);
  state={...state,attributes:{...state.attributes}};
  if(service==='turn_off' && domain==='fan') state.state='off';
  if(service==='turn_on' && domain==='fan') state.state='on';
  if(service==='set_percentage') { state.attributes.percentage=data.percentage; state.state=data.percentage?'on':'off'; }
  if(service==='set_preset_mode') state.attributes.preset_mode=data.preset_mode;
  if(service==='set_value' && domain==='number') sweep=data.value;
  if(service==='oscillate') {
    state.attributes.oscillating=data.oscillating;
    clearInterval(movement);
    if(data.oscillating) { let direction=position>config.target_angle?-1:1; movement=setInterval(()=>{position+=direction*5;if(position<=-120 || position>=120)direction*=-1;update();},150); }
  }
  update();
}};cards.forEach(card=>{card.hass=hass;});}update();
</script>
</html>
