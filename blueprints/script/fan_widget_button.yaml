blueprint:
  name: Smart Fan - Widget button
  description: >-
    Create one script for each iOS widget button. Select the same Smart Fan Widget
    controller for all buttons. Script calls run server-side; no dashboard is required.
  domain: script
  source_url: https://github.com/jancrab/smart-fan-2-card/blob/main/blueprints/script/fan_widget_button.yaml
  input:
    controller:
      name: Widget controller script
      description: Select the script created from Smart Fan - Widget controller.
      selector:
        entity:
          domain: script
    operation:
      name: Button action
      selector:
        select:
          options:
            - {value: power, label: Power}
            - {value: everyday, label: Everyday}
            - {value: cycling_set, label: Set}
            - {value: cycling_lock, label: Lock}
            - {value: strength, label: Strength}
            - {value: natural, label: Natural / Normal}
mode: single
max_exceeded: silent
sequence:
  - action: script.turn_on
    target:
      entity_id: !input controller
    data:
      variables:
        operation: !input operation
