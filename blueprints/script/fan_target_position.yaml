blueprint:
  name: Fan – feste Kopfposition mit echter Rückmeldung
  description: >-
    Benötigt einen echten Live-Positionssensor. oscillation_angle ist nur der
    Schwenkbereich und darf nicht als Positionssensor verwendet werden.
    Positioniert durch Schwenken und anschließendes Stoppen am Ziel.
  domain: script
  input:
    fan:
      name: Ventilator
      selector:
        entity:
          domain: fan
    sweep:
      name: Schwenkbereich
      selector:
        entity:
          domain: number
    position:
      name: Tatsächliche Kopfposition (Live-Sensor)
      selector:
        entity:
          domain:
            - sensor
            - number
    target:
      name: Zielposition
      default: 0
      selector:
        number:
          min: -360
          max: 360
          step: 1
          unit_of_measurement: °
          mode: box
    tolerance:
      name: Toleranz
      default: 2
      selector:
        number:
          min: 0
          max: 20
          step: 1
          unit_of_measurement: °
    timeout:
      name: Zeitlimit
      default: 30
      selector:
        number:
          min: 1
          max: 120
          step: 1
          unit_of_measurement: s
mode: single
max_exceeded: silent
variables:
  fan_entity: !input fan
  sweep_entity: !input sweep
  position_entity: !input position
  target_position: !input target
  allowed_error: !input tolerance
  timeout_seconds: !input timeout
sequence:
  - if:
      - condition: template
        value_template: >-
          {{ position_entity == sweep_entity or
             not is_number(states(position_entity)) or
             not is_number(states(sweep_entity)) or
             not is_number(state_attr(sweep_entity, 'max')) or
             states(fan_entity) not in ['on', 'off'] }}
    then:
      - stop: Echte Positionsrückmeldung oder gültiger Schwenkbereich fehlt.
        error: true
  - action: fan.turn_on
    target:
      entity_id: !input fan
  - action: fan.oscillate
    target:
      entity_id: !input fan
    data:
      oscillating: false
  - variables:
      start_position: "{{ states(position_entity) | float }}"
  - if:
      - condition: template
        value_template: "{{ (start_position | float - target_position | float) | abs <= allowed_error | float }}"
    then:
      - stop: Ziel bereits erreicht.
  - action: number.set_value
    target:
      entity_id: !input sweep
    data:
      value: "{{ state_attr(sweep_entity, 'max') | float }}"
  - action: fan.oscillate
    target:
      entity_id: !input fan
    data:
      oscillating: true
  - wait_template: >-
      {% set position = states(position_entity) %}
      {{ not is_number(position) or not is_state(fan_entity, 'on') or
         (position | float(0) - target_position | float) | abs <= allowed_error | float or
         (start_position | float < target_position | float and position | float(0) >= target_position | float) or
         (start_position | float > target_position | float and position | float(0) <= target_position | float) }}
    timeout:
      seconds: "{{ timeout_seconds | int }}"
    continue_on_timeout: true
  - action: fan.oscillate
    target:
      entity_id: !input fan
    data:
      oscillating: false
  - if:
      - condition: template
        value_template: "{{ not wait.completed or not is_number(states(position_entity)) or not is_state(fan_entity, 'on') }}"
    then:
      - stop: Ziel nicht bestätigt – Zeitlimit oder Rückmeldung verloren.
        error: true
